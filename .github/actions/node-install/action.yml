name: 'Instalar Node y dependencias'
description: 'Setup de Node con caché de npm e instalación reproducible. La usan todos los workflows del repo para no repetir el bloque.'

inputs:
  node_version:
    description: 'Versión de Node'
    required: false
    default: '22.x'

runs:
  using: 'composite'
  steps:
    - name: Node ${{ inputs.node_version }}
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ inputs.node_version }}
        cache: npm

    - name: Instalar dependencias
      shell: bash
      # --ignore-scripts: `npm ci` ejecuta los scripts de ciclo de vida de CADA
      # dependencia, así que un paquete comprometido corre código en el runner
      # —con el token del workflow al alcance— antes de que ninguna puerta lo
      # revise. Dependabot cubre CVE publicadas; esto cubre lo otro.
      #
      # Se comprobó que el repo construye sin ellos antes de fijarlo, y los pocos
      # que los traen están en contracts/scripts-de-instalacion.txt.
      run: npm ci --ignore-scripts --no-audit --no-fund
      env:
        # Los hooks de git no corren en CI: las mismas puertas ya son jobs.
        HUSKY: '0'
