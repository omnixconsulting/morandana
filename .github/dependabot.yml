version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule: { interval: weekly, day: monday }
    # Espera antes de proponer una version nueva. GitHub ya aplica 3 dias por
    # omision; esto lo sube a 7 y deja la decision escrita en el repo, donde se
    # puede revisar, en vez de colgada de un valor que GitHub puede cambiar.
    #
    # Por que sirve: cuando secuestran un paquete y publican una version
    # maliciosa, la deteccion y el retiro tardan de horas a dias.
    # `validar-cadena.sh` no lo atraparia: la version llega desde el registro y
    # con su hash correcto.
    #
    # Lo que NO retrasa: las actualizaciones de seguridad. El `cooldown` solo
    # aplica a las de version, asi que un parche de CVE sigue llegando el mismo
    # dia.
    #
    # Y NO se pone en `github-actions`: la tabla de ecosistemas soportados de
    # GitHub no lo incluye --verificado el 3-oct-2026--. Ponerlo ahi seria una
    # clave ignorada, que es peor que nada porque parece proteccion.
    cooldown:
      default-days: 7
    groups:
      minor-y-patch: { update-types: [minor, patch] }
    labels: [dependencias]
    open-pull-requests-limit: 5
    # Los saltos de versión MAYOR no se automatizan: son migraciones planeadas,
    # no un PR que alguien fusiona un martes. Se ignoran en bloque en vez de
    # enumerarlos uno por uno.
    #
    # Por qué en bloque: hasta el 19-sep-2026 esto era una lista por dependencia,
    # distinta en cada uno de los siete repos y todas incompletas. Se colaron
    # @eslint/js 10 y react-router-dom 7 en el portal, eslint 10 en morandana y
    # zod 4 en shikomi y mise — cada hueco era una entrada que nadie agregó. Una
    # política escrita como enumeración deriva; escrita como regla, no.
    #
    # Lo que se pierde: Dependabot ya no avisa de que salió un mayor nuevo. Eso se
    # recupera con `npm outdated` al planear la migración, que es cuando sirve.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule: { interval: monthly }
    labels: [dependencias]
    groups:
      # init y analyze tienen que ir en la misma versión: con una mezclada,
      # analyze falla con «Loaded a configuration file for version…». Dos PR
      # separados nunca pasan solos.
      codeql-action:
        patterns: ["github/codeql-action/*"]
