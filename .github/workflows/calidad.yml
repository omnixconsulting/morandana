name: Calidad

# Nivel 0 del estándar de QA de Meridian (docs/proceso-qa.md del repo meridian).
# Capas L0 (lint, tipos, secretos, build) y L2 (políticas RLS contra Postgres).
#
# UN SOLO JOB, a propósito. Estaba partido en tres —`calidad`, `base` e
# `historial`— y los tres juntos sumaban ~1 min de trabajo real. GitHub factura
# CADA job redondeado al minuto, así que tres jobs cortos cobraban 3 minutos por
# uno de trabajo. Es la misma razón por la que el lint del título vive dentro de
# `gatekeeper.yml` y no en su propio workflow (oct-2026).
#
# Lo que se pierde: el paralelismo —ahora corren en fila, unos 25 s más de
# reloj— y ver de un vistazo qué capa falló. Lo que se gana: una sola
# instalación de dependencias en vez de tres checkouts.

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo al mismo PR cancela la corrida anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Lint, tipos, secretos, build y RLS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `pull-requests: write` para los comentarios del título y de «Como
    # probarlo», que antes vivían en su propio job. Va aquí y no arriba para que
    # ningún job que se agregue después lo herede sin que alguien lo decida.
    # Repite `contents: read` a propósito: un bloque de permisos en el job
    # REEMPLAZA el del workflow, no lo extiende, y sin eso el checkout falla
    # con «repository not found» --medido el 14-oct-2026--.
    permissions: { contents: read, pull-requests: write }
    steps:
      # `fetch-depth: 0` porque gitleaks necesita el historial, no un checkout
      # somero. Antes era exclusivo del job `historial`; ahora lo paga todo el
      # job, que es el precio de no pagar dos checkouts más.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: ./.github/actions/node-install

      # ── Secretos primero: es lo más barato y lo más caro de dejar pasar ──

      # `guardia` mira el ÁRBOL. Esta mira los COMMITS del PR: un secreto que
      # entra en un commit y se borra en el siguiente deja el árbol limpio y se
      # queda en los objetos de git para siempre.
      - name: Guardia de historial
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          CABEZA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then
            ./scripts/guardia-historial.sh "$BASE..$CABEZA"
          else
            ./scripts/guardia-historial.sh
          fi

      # El arnes de llaves plantadas (5.7.0): comprueba que LOS DOS motores atrapen
      # lo mismo. Necesita los dos, y gitleaks solo esta garantizado aqui. Va
      # DESPUES de la guardia del historial: que las dos listas diverjan no debe
      # impedir escanear los commits del PR.
      - name: Arnes de llaves plantadas
        run: ./scripts/arnes-secretos.sh

      # LOS WORKFLOWS DE VERDAD, POR ACTIONLINT Y SHELLCHECK
      #
      # Esto no estaba. El unico lugar de CI que invocaba al validador era su
      # ARNES --mas abajo, en «Arneses de los propios validadores»--, y el arnes
      # copia el validador a un directorio de fixtures y le rompe casos a
      # proposito ahi: comprueba que el validador siga sirviendo, y no mira ni un
      # archivo de este repo. Asi que `.github/workflows/` no pasaba por
      # actionlint ni por shellcheck en ninguna puerta de CI.
      #
      # Lo cubria la Puerta 1, en la maquina de quien commitea, y ahi se perdia:
      # si shellcheck no esta instalado, actionlint se salta el analisis del shell
      # y el validador lo decia en un `::notice::` facil de pasar por alto. En
      # jerrymedrano eso dejo latente un SC2016 y en medicarmen un SC2046 que
      # llevaba dias en `main`. Desde este PR, en CI faltar shellcheck es un
      # error, no un aviso (ver `scripts/validar-workflows.sh`).
      #
      # VA TEMPRANO, no junto a su arnes: dura segundos, y GitHub factura el job
      # redondeado al minuto. Un `.github/` roto ya no paga lint, tipos, build y
      # el Postgres de las pruebas RLS antes de decirlo.
      - name: Validador de workflows
        run: npm run workflows
      # Los `.sh` de `scripts/`, que el validador de arriba NO mira: ese revisa
      # los bloques `run:` de los `.yml`. Va aqui y no solo en la cadena local
      # porque este CI enumera los scripts uno por uno: una puerta que solo
      # viviera en esa cadena la correria quien commitea, y nadie mas.
      - name: Shellcheck sobre scripts/
        run: npm run shell

      # ── Capa L0 ──

      - name: Lint
        run: npm run lint

      # Los checks que la proteccion de rama exige, contra el contrato. Desde el
      # 13-oct-2026 se enumeran por nombre: el agregador que los esperaba en un
      # runner costaba ~1,800 min de Actions al mes.
      #
      # AQUI SOLO CORRE EL CHEQUEO 1 --que cada declarado exista como job--, porque
      # `GITHUB_TOKEN` **no puede** leer la proteccion de rama: `administration` no
      # existe como scope de ese token. El chequeo 2 corre en la Puerta 1, con el
      # `gh` de quien commitea, que si es admin.
      - name: Contrato de checks requeridos
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: npm run checks

      # Y su arnes, que es lo unico que separa el validador de «alguien renombro un
      # job y nadie se enterara». Su modo de falla es silencioso.
      - name: Arnes del contrato de checks requeridos
        run: ./scripts/arnes-checks-requeridos.sh

      - name: Typecheck
        run: npm run typecheck

      # El bundle del navegador es público: se revisa antes de construirlo.
      - name: Guardia de secretos
        run: npm run guardia

      # Las cabeceras se declaran en next.config.ts: nadie las compila contra
      # un esquema y un recorte distraído las borra en silencio.
      - name: Cabeceras de seguridad
        run: npm run cabeceras

      # Dependabot cubre CVE publicadas. Esto cubre lo otro: procedencia,
      # integridad, y que ninguna dependencia nueva traiga un postinstall sin
      # que alguien lo note.
      - name: Cadena de suministro
        run: npm run cadena

      # LFPDPPP: «sin PII en logs, analítica ni errores» estaba escrito en el
      # estándar y no lo comprobaba nada. Era una regla, no una puerta.
      - name: PII en logs
        run: npm run pii

      - name: Build
        run: npm run build

      # ── Arneses de los propios validadores ──

      # El arnes del validador de workflows (5.7.2): comprueba que sus expresiones
      # sigan casando. Una regex que deja de casar no falla, pasa, y encontro asi dos
      # cegueras del propio validador.
      #
      # Se queda, y SUMA al paso «Validador de workflows» de arriba en vez de
      # sustituirlo: ese corre el validador sobre los workflows de este repo, este
      # comprueba que el validador detecte lo que dice detectar. Sin el primero no
      # se miran los archivos; sin el segundo, un validador ciego pasa en verde.
      - name: Arnes del validador de workflows
        run: ./scripts/arnes-workflows.sh

      # El arnés del chequeo de licencias (§5.7): rompe cada caso a propósito sobre
      # copias del lockfile y del contrato, y comprueba que falle con su mensaje. Si
      # la lista permisiva o el formato del contrato dejan de casar, un validador
      # ciego no falla: pasa.
      - name: Arnés del chequeo de licencias
        run: ./scripts/arnes-licencias.sh

      # El arnés del detector de deriva de migraciones. Corre desde el
      # 12-oct-2026: el detector entró el 3-oct y su arnés nunca estuvo en una
      # puerta, así que cuando el CLI de Supabase dejó de emitir JSON por
      # omisión el detector quedó inservible y el arnés seguía pasando a mano
      # sin tocar la línea rota. Es de fixtures y de un CLI de mentira en el
      # PATH: no toca Supabase ni la red.
      - name: Arnés del detector de deriva
        run: ./scripts/arnes-deriva.sh

      # ── Capa L2: las políticas RLS contra un Postgres real ──
      # El sitio entero habla con Supabase por la llave `anon`, que viaja en el
      # bundle del navegador, así que RLS es lo único que separa a un visitante
      # de la tabla `leads` (nombre, correo, teléfono y mensaje de personas
      # reales). Va al final porque es lo que más tarda en levantar.

      # Los binarios de Postgres vienen preinstalados en el runner; base-local.sh
      # los localiza. No hace falta Docker ni `supabase start`.
      # El chequeo de puerto de `base-local.sh`: levanta su propio Postgres en un
      # puerto aparte y comprueba que el script se niegue, en vez de matar, si el
      # puerto lo tiene otro datadir. La aserción que importa es que el proceso
      # ajeno siga vivo después.
      - name: Arnés del chequeo de puerto de base-local
        run: ./scripts/arnes-base-local.sh

      # El arnés de CONCURRENCIA, que es otro agujero: dos invocaciones a la vez
      # se destruían entre sí y dejaban el datadir corrupto, con dos errores que
      # no mencionan la concurrencia. El del puerto no lo cubría. Usa un PGDATA
      # y un puerto temporales.
      - name: Arnés de concurrencia de base-local
        run: ./scripts/arnes-base-local-concurrencia.sh

      - name: Levantar Postgres con las migraciones
        run: npm run db:local

      - name: Pruebas SQL
        run: npm run db:test


      # ───────────────────────────────────────────────────────────────────────
      # LO QUE ERA EL JOB `Gatekeeper`, Y POR QUE AHORA ES UN PASO DE ESTE
      #
      # Gatekeeper ya no esperaba a nadie --eso se quito el 13-oct-2026, cuando
      # la proteccion de rama paso a exigir los checks por nombre-- asi que lo
      # unico que le quedaba era validar el titulo y el cuerpo del PR: NUEVE
      # SEGUNDOS de trabajo. Pero GitHub cobra cada job redondeado al minuto
      # hacia arriba, asi que cobraba uno entero, 150 veces en dos dias y medio.
      # Medido el 16-oct-2026: 150 min facturados por 23 de trabajo real, el
      # 84 % puro redondeo. A esa escala no hay nada que optimizar adentro: el
      # unico recorte posible es que deje de ser un job.
      #
      # Como paso de un job que ya corria en cada PR, cuesta sus nueve segundos.
      #
      # SE PERDIO EL DISPARO `edited`, A PROPOSITO
      # Gatekeeper escuchaba `edited` para que corregir el titulo en GitHub
      # volviera a validarlo. Medido: 52 de sus 150 corridas eran eventos
      # `edited` --el 35 %--, y casi todas revalidaban un titulo que no se habia
      # roto, nada mas porque alguien toco la descripcion. Este workflow no
      # escucha `edited` y no se le agrega: heredarlo aqui haria que cada edicion
      # de la descripcion reejecutara las pruebas enteras, que cuesta MAS que el
      # job que acabamos de quitar.
      # A cambio, el comentario de abajo dice como revalidar. Un clic cuando
      # pasa, contra un minuto cada vez que alguien edita un texto.
      #
      # VAN AL FINAL Y CON `!cancelled()`
      # Al final para que una Puerta 1 en rojo no esconda que falta la seccion
      # «Como probarlo»: las dos cosas se ven en la misma corrida, como cuando
      # eran dos jobs en paralelo. Y solo en PR: en push a `main` no hay PR que
      # mirar.
      # ───────────────────────────────────────────────────────────────────────

      # El título del PR sigue Conventional Commits, igual que los mensajes de
      # commit. Va como check y no como hook porque el título se edita en
      # GitHub, donde ningún hook local puede verlo.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        id: lint
        if: "!cancelled() && github.event_name == 'pull_request'"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: "!cancelled() && github.event_name == 'pull_request' && steps.lint.outputs.error_message != null"
        with:
          header: pr-titulo
          message: |
            El título de este PR tiene que seguir [Conventional Commits](https://www.conventionalcommits.org/es/v1.0.0/), igual que los mensajes de commit.

            ```
            ${{ steps.lint.outputs.error_message }}
            ```

            Ejemplos válidos en este portafolio: `feat(proposals): …`, `fix(ci): …`, `docs: …`, `chore(deps): …`.

            Corrígelo arriba y vuelve a correr este check con **Re-run jobs**: editar el título ya no dispara el workflow por sí solo, porque hacerlo reejecutaba las pruebas enteras cada vez que alguien tocaba un texto.

      # Borra el comentario cuando el título se corrige, para no dejar un aviso
      # rancio colgando en un PR que ya está bien.
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: "!cancelled() && github.event_name == 'pull_request' && steps.lint.outputs.error_message == null"
        with:
          header: pr-titulo
          delete: true

      - name: Seccion «Como probarlo»
        id: comoprobar
        if: "!cancelled() && github.event_name == 'pull_request'"
        # AQUI HUBO UNA EXENCION PARA `dependabot[bot]`, Y SE FUE
        #
        # Decia `if: github.event.pull_request.user.login != 'dependabot[bot]'`,
        # porque el bot no escribe pasos: su cuerpo es el changelog del paquete.
        # Funcionaba --los PR del bot pasaban-- y aun asi se cambio el
        # 14-oct-2026: lo que hacia era borrar la pregunta. «Como se comprueba
        # que esto no rompio nada» SI tiene respuesta para un bump --que el
        # comentario de version corresponda al SHA nuevo, por ejemplo--, solo que
        # es distinta de la de un cambio de codigo, y lo que no tiene sentido es
        # pedirsela al bot.
        #
        # Asi que la respuesta vive versionada en `.github/plantillas/`, donde se
        # revisa en un diff, y `dependabot-como-probarlo.yml` la pega. Nadie
        # queda exento y la seccion se valida siempre.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # `dependabot[bot]` es el UNICO autor cuyo cuerpo lo escribe otro job de
          # esta misma corrida, asi que es el unico que necesita espera.
          AUTOR: ${{ github.event.pull_request.user.login }}
        run: |
          # El encabezado se ancla en «probarlo» y no en «Como probarlo»: la tilde
          # de «Como» es multibyte y una clase [oa] no casa de forma fiable en el
          # grep/awk del runner bajo cualquier locale.
          ENC='^[[:space:]]*#{1,6}[[:space:]].*[Pp]robarlo[[:space:]]*$'
          falla() {
            echo "razon=$1" >> "$GITHUB_OUTPUT"
            echo "::error::$1"
            exit 1
          }

          # EL CUERPO SE LEE VIVO, NO DEL PAYLOAD DEL EVENTO
          #
          # Hasta el 14-oct-2026 el cuerpo entraba por env desde la expresion
          # `pull_request.body` del evento, que es una FOTO del cuerpo al momento
          # de disparar la corrida --el literal de esa expresion no se escribe
          # aqui a proposito: actionlint y zizmor lo marcan aunque este en un
          # comentario, y tienen razon, porque para ellos un comentario no se
          # distingue del codigo--. Esa foto hace imposible que
          # `dependabot-como-probarlo.yml` sirva de algo: ese job pega la seccion
          # unos segundos despues del disparo, y este paso seguiria leyendo el
          # cuerpo de antes y diria «falta la seccion» con la seccion YA puesta.
          # Medido en meridian-crm, PR #109: el pegado paso a las 20:46:55 y el
          # paso dijo que faltaba a las 20:47:19.
          #
          # Y no hay salida por el lado del evento: una edicion hecha con
          # GITHUB_TOKEN **no dispara workflows** --regla de GitHub contra la
          # recursion-- y un PR de Dependabot no puede leer secretos, asi que un
          # PAT tampoco es opcion. Leer vivo es el unico camino.
          #
          # El cuerpo sigue siendo entrada NO CONFIABLE: entra a una variable de
          # shell y nunca se interpola en el script.
          cuerpo_vivo() { gh pr view "$PR" --json body --jq '.body // ""'; }
          CUERPO=$(cuerpo_vivo)

          # La espera: el pegado tarda ~8 s y este paso puede empezar antes. Solo
          # para Dependabot, para que un PR humano sin seccion falle al instante.
          if [ "$AUTOR" = 'dependabot[bot]' ]; then
            intento=0
            until grep -qE "$ENC" <<<"$CUERPO"; do
              intento=$((intento + 1))
              [ "$intento" -gt 9 ] && break
              echo "  esperando a que el pegado escriba la seccion ($intento/9)..."
              sleep 5
              CUERPO=$(cuerpo_vivo)
            done
          fi

          # Herestring y no tuberia: con tuberia, `printf` ensuciaba el log con
          # `write error: Broken pipe` en todo PR de cuerpo largo, y un error en
          # el log de una puerta que paso ensena a ignorar los errores del log.
          grep -qE "$ENC" <<<"$CUERPO" \
            || falla 'Falta la seccion «## Como probarlo» en el cuerpo del PR.'
          seccion=$(awk -v enc="$ENC" '
            $0 ~ enc { dentro=1; next }
            dentro && /^[[:space:]]*#{1,6}[[:space:]]/ { dentro=0 }
            dentro { print }
          ' <<<"$CUERPO")
          desnudo=$(tr -d '[:space:]' <<<"$seccion")
          [ -z "$desnudo" ] && falla 'La seccion «Como probarlo» esta vacia.'
          if grep -qE '^[[:space:]]*[0-9]+[.)][[:space:]]+[^[:space:]]' <<<"$seccion"; then
            echo 'Tiene pasos numerados.'; exit 0
          fi
          # Sin pasos se acepta una explicacion, no un encogimiento de hombros.
          grep -qiE '^(n/?a|na|nada|ninguno|none|-{1,3})[.!]*$' <<<"$desnudo" \
            && falla 'La seccion solo dice «N/A». Si no hay nada que probar a mano, di por que.'
          [ "${#desnudo}" -lt 30 ] \
            && falla "Sin pasos numerados, la explicacion debe decir por que (tiene ${#desnudo} caracteres, minimo 30)."
          echo "Sin pasos, pero explica (${#desnudo} caracteres)."

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: "!cancelled() && github.event_name == 'pull_request' && steps.comoprobar.outputs.razon != ''"
        with:
          header: pr-comoprobar
          message: |
            Este PR necesita una seccion **`## Como probarlo`** en su cuerpo.

            ```
            ${{ steps.comoprobar.outputs.razon }}
            ```

            Pasos numerados desde un estado limpio: que abrir, con que usuario o rol, que hacer, y que debe verse al final. Si el cambio no tiene nada que ejercitar a mano —solo documentacion, por ejemplo— di **por que** en una linea: «N/A» a secas no cuenta.

            Escríbela arriba y vuelve a correr este check con **Re-run jobs**: editar el cuerpo ya no dispara el workflow por sí solo.

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: "!cancelled() && github.event_name == 'pull_request' && steps.comoprobar.outputs.razon == ''"
        with:
          header: pr-comoprobar
          delete: true
