name: Calidad

# Nivel 0 del estándar de QA de Meridian (docs/proceso-qa.md del repo meridian).
# Capa L0: lint, tipos, guardia de secretos y build.

on:
  push:
    branches: [main]
  pull_request:

# Un push nuevo al mismo PR cancela la corrida anterior.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  calidad:
    name: Lint, tipos, secretos y build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/node-install

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      # El bundle del navegador es público: se revisa antes de construirlo.
      - name: Guardia de secretos
        run: npm run guardia

      - name: Build
        run: npm run build

  # Capa L2: las políticas RLS contra un Postgres real. El sitio entero habla con
  # Supabase por la llave `anon`, que viaja en el bundle del navegador, así que
  # RLS es lo único que separa a un visitante de la tabla `leads` (nombre, correo,
  # teléfono y mensaje de personas reales).
  base:
    name: Políticas RLS contra Postgres
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Los binarios de Postgres vienen preinstalados en el runner; base-local.sh
      # los localiza. No hace falta Docker ni `supabase start`.
      - name: Levantar Postgres con las migraciones
        run: npm run db:local

      - name: Pruebas SQL
        run: npm run db:test

  # `guardia` mira el ÁRBOL. Esta mira los COMMITS del PR: un secreto que entra
  # en un commit y se borra en el siguiente deja el árbol limpio y se queda en
  # los objetos de git para siempre.
  historial:
    name: Secretos en el historial
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0   # gitleaks necesita el historial, no un checkout somero

      - name: Guardia de historial
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          CABEZA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE" ]; then
            ./scripts/guardia-historial.sh "$BASE..$CABEZA"
          else
            ./scripts/guardia-historial.sh
          fi
