name: CodeQL
# Repo privado en plan Free: sin Code Scanning en GitHub. Se analiza igual, el SARIF
# se guarda como artefacto y el job falla si hay hallazgos (error/warning).
#
# NO corre en push a main, a propósito: este repo fusiona con SQUASH, así que el
# commit que cae en main tiene el contenido exacto que ya se analizó en el PR y
# la segunda corrida no aportaba nada, solo minutos de Actions. El cron semanal
# queda de red para cualquier cosa que entrara sin pasar por un PR (oct-2026).
on:
  # SIN `paths-ignore`, A PROPOSITO (13-oct-2026)
  #
  # Al pasar a exigir los checks POR NOMBRE, un filtro de rutas se volvio
  # inviable: un check requerido que NO aparece bloquea el PR para siempre.
  # (Un job SALTADO por un `if:` si reporta y cuenta como aprobado; un workflow
  # que no se dispara, no. Esa es la diferencia.)
  #
  # Y medido, el filtro no compraba casi nada: salvo 1 de 37 ramas en 10 dias,
  # porque un PR de documentacion de esta casa casi siempre toca tambien
  # scripts o workflows.
  #
  # El ahorro vive ADENTRO del job: si el PR no trae codigo, reporta verde en
  # segundos sin bajar CodeQL.
  pull_request:
  schedule: [{ cron: '0 9 * * 1' }]
permissions: { actions: read, contents: read, pull-requests: read }
# Sin esto, cada push a una rama arrancaba un análisis de 3 min y el anterior
# seguía vivo hasta terminar, aunque ya no le importara a nadie.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Se pregunta por la API, antes del checkout: un PR de solo documentacion no
      # baja el repo ni el bundle de CodeQL. En el cron no hay PR, y entonces se
      # analiza siempre.
      - name: ¿El PR trae codigo?
        id: codigo
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          if [ -z "${PR:-}" ]; then
            echo 'hay=si' >> "$GITHUB_OUTPUT"
            echo 'Sin PR (cron): se analiza.'
            exit 0
          fi
          n=$(gh api "/repos/$GH_REPO/pulls/$PR/files" --paginate -q '.[].filename' \
                | grep -vcE '\.md$' || true)
          if [ "${n:-0}" -gt 0 ]; then
            echo 'hay=si' >> "$GITHUB_OUTPUT"; echo "$n archivo(s) que no son .md: se analiza."
          else
            echo 'hay=no' >> "$GITHUB_OUTPUT"; echo 'Solo documentacion: nada que analizar.'
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.codigo.outputs.hay == 'si'
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: steps.codigo.outputs.hay == 'si'
        with: { languages: javascript-typescript }
      - uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        if: steps.codigo.outputs.hay == 'si'
        with: { upload: never, output: sarif }
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: steps.codigo.outputs.hay == 'si'
        with: { name: codeql-sarif, path: sarif, retention-days: 30 }
      - name: Fallar si hay hallazgos
        if: steps.codigo.outputs.hay == 'si'
        run: |
          n=$(jq '[.runs[].results[] | select((.level // "warning") != "note")] | length' sarif/*.sarif | paste -sd+ - | bc)
          echo "hallazgos: $n"
          if [ "$n" -gt 0 ]; then jq -r '.runs[].results[] | "\(.level // "warning")\t\(.ruleId)\t\(.locations[0].physicalLocation.artifactLocation.uri):\(.locations[0].physicalLocation.region.startLine)"' sarif/*.sarif; exit 1; fi
