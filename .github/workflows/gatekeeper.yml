name: Gatekeeper
# Un unico check requerido que espera a que TODOS los demas terminen en verde.
#
# POR QUE
# La proteccion de rama exige una lista de checks por nombre. Mantenerla a mano
# no escala: cada workflow nuevo obliga a tocar la configuracion del repo, y un
# job que no corre —porque su area no cambio— nunca reporta estado, asi que la
# proteccion o espera para siempre o hay que apagarla.
#
# Este job es el unico que se marca como requerido. El resto se descubre solo.
#
# REGLA (proceso-qa.md 5.4): si este repo adopta `changed-files`, el gatekeeper
# tiene que estar ya. Uno sin el otro rompe la Puerta 2 en silencio, que es peor
# que no tener ninguno de los dos.
on:
  pull_request:
    branches: [main]
    # `edited` para que corregir el título en GitHub vuelva a validarlo.
    types: [opened, reopened, edited, synchronize]
permissions: { checks: read, statuses: read, pull-requests: write }
jobs:
  gatekeeper:
    name: Gatekeeper
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # El título del PR sigue Conventional Commits, igual que los mensajes de
      # commit. Vive aquí y no en su propio workflow porque GitHub cobra cada job
      # redondeado al minuto, y este paso dura segundos (sep-2026). Va como check
      # y no como hook porque el título se edita en GitHub, donde ningún hook
      # local puede verlo. Comenta el error en vez de solo fallar.
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        id: lint
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: always() && steps.lint.outputs.error_message != null
        with:
          header: pr-titulo
          message: |
            El título de este PR tiene que seguir [Conventional Commits](https://www.conventionalcommits.org/es/v1.0.0/), igual que los mensajes de commit.

            ```
            ${{ steps.lint.outputs.error_message }}
            ```

            Ejemplos válidos en este portafolio: `feat(proposals): …`, `fix(ci): …`, `docs: …`, `chore(deps): …`.

      # Borra el comentario cuando el título se corrige, para no dejar un aviso
      # rancio colgando en un PR que ya está bien.
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: steps.lint.outputs.error_message == null
        with:
          header: pr-titulo
          delete: true

      # La seccion «Como probarlo» del cuerpo del PR. Vive aqui, junto al titulo,
      # porque GitHub cobra cada job redondeado al minuto y este paso dura
      # segundos. La Puerta 2 pide revision humana del area, y en un equipo chico
      # la hace una sola persona: con los pasos escritos, quien revisa reproduce
      # el cambio sin depender de quien lo hizo.
      - name: Seccion «Como probarlo»
        id: comoprobar
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Este job NO hace checkout --no le hace falta--, asi que `gh` no tiene
          # de donde deducir el repo. `GH_REPO` se lo dice sin meter una expresion
          # al script.
          GH_REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          # `dependabot[bot]` es el UNICO autor cuyo cuerpo lo escribe otro job de
          # esta misma corrida, asi que es el unico que necesita espera.
          AUTOR: ${{ github.event.pull_request.user.login }}
        run: |
          # El encabezado se ancla en «probarlo» y no en «Como probarlo»: la tilde
          # de «Como» es multibyte y una clase [oa] no casa de forma fiable en el
          # grep/awk del runner bajo cualquier locale.
          ENC='^[[:space:]]*#{1,6}[[:space:]].*[Pp]robarlo[[:space:]]*$'
          falla() {
            echo "razon=$1" >> "$GITHUB_OUTPUT"
            echo "::error::$1"
            exit 1
          }
          # EL CUERPO SE LEE VIVO, NO DEL PAYLOAD DEL EVENTO
          #
          # Antes el cuerpo entraba por env desde la expresion `pull_request.body`
          # del evento, que es una FOTO del cuerpo al momento de disparar la
          # corrida --el literal de esa expresion no se escribe aqui a proposito:
          # actionlint y zizmor lo marcan aunque este en un comentario, y tienen
          # razon, porque para ellos un comentario no se distingue del codigo--.
          # Esa foto hacia imposible que `dependabot-como-probarlo.yml` sirviera
          # de algo: ese job pega la seccion unos segundos despues del disparo, y
          # este paso seguia leyendo el cuerpo de antes. Verificado en meridian-crm
          # con su PR #109: el pegado paso a las 20:46:55 y este paso dijo «falta
          # la seccion» a las 20:47:19, con la seccion YA en el cuerpo.
          #
          # Y no hay salida por el lado del evento: Gatekeeper si escucha `edited`,
          # pero **una edicion hecha con GITHUB_TOKEN no dispara workflows** --regla
          # de GitHub contra la recursion-- y un PR de Dependabot no puede leer
          # secretos, asi que un PAT tampoco es opcion. Leer vivo es el unico camino.
          #
          # El cuerpo sigue siendo entrada NO CONFIABLE: entra a una variable de
          # shell y nunca se interpola en el script. Esto es mas seguro que antes,
          # no menos: ya no entra NINGUNA expresion con contenido del PR a este
          # script, ni por env.
          cuerpo_vivo() { gh pr view "$PR" --json body --jq '.body // ""'; }
          CUERPO=$(cuerpo_vivo)

          # La espera: el pegado tarda ~8 s y este paso puede empezar antes. Solo
          # para Dependabot, para que un PR humano sin seccion falle al instante.
          if [ "$AUTOR" = 'dependabot[bot]' ]; then
            intento=0
            until grep -qE "$ENC" <<<"$CUERPO"; do
              intento=$((intento + 1))
              [ "$intento" -gt 9 ] && break
              echo "  esperando a que el pegado escriba la seccion ($intento/9)..."
              sleep 5
              CUERPO=$(cuerpo_vivo)
            done
          fi

          # Herestring y no tuberia, por lo mismo que en
          # `dependabot-como-probarlo.yml`. Aqui NO habia bug --este bloque no
          # lleva `pipefail` y el veredicto siempre fue el de `grep`-- pero
          # ensuciaba el log con `printf: write error: Broken pipe` en todo PR de
          # cuerpo largo, y un error en el log de una puerta que paso ensena a
          # ignorar los errores del log.
          grep -qE "$ENC" <<<"$CUERPO" \
            || falla 'Falta la seccion «## Como probarlo» en el cuerpo del PR.'
          seccion=$(awk -v enc="$ENC" '
            $0 ~ enc { dentro=1; next }
            dentro && /^[[:space:]]*#{1,6}[[:space:]]/ { dentro=0 }
            dentro { print }
          ' <<<"$CUERPO")
          desnudo=$(tr -d '[:space:]' <<<"$seccion")
          [ -z "$desnudo" ] && falla 'La seccion «Como probarlo» esta vacia.'
          if grep -qE '^[[:space:]]*[0-9]+[.)][[:space:]]+[^[:space:]]' <<<"$seccion"; then
            echo 'Tiene pasos numerados.'; exit 0
          fi
          # Sin pasos se acepta una explicacion, no un encogimiento de hombros.
          grep -qiE '^(n/?a|na|nada|ninguno|none|-{1,3})[.!]*$' <<<"$desnudo" \
            && falla 'La seccion solo dice «N/A». Si no hay nada que probar a mano, di por que.'
          [ "${#desnudo}" -lt 30 ] \
            && falla "Sin pasos numerados, la explicacion debe decir por que (tiene ${#desnudo} caracteres, minimo 30)."
          echo "Sin pasos, pero explica (${#desnudo} caracteres)."

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: always() && steps.comoprobar.outputs.razon != ''
        with:
          header: pr-comoprobar
          message: |
            Este PR necesita una seccion **`## Como probarlo`** en su cuerpo.

            ```
            ${{ steps.comoprobar.outputs.razon }}
            ```

            Pasos numerados desde un estado limpio: que abrir, con que usuario o rol, que hacer, y que debe verse al final. Si el cambio no tiene nada que ejercitar a mano —solo documentacion, por ejemplo— di **por que** en una linea: «N/A» a secas no cuenta.

      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88 # v3.0.5
        if: steps.comoprobar.outputs.razon == ''
        with:
          header: pr-comoprobar
          delete: true

      # AQUI VIVIA `upsidr/merge-gatekeeper`, Y SE FUE POR LO QUE COSTABA
      #
      # Su trabajo era esperar a que los demas checks terminaran, para que la
      # proteccion de rama pudiera exigir UN solo nombre en vez de enumerarlos.
      # Medido el 12-oct-2026 sobre los 8 repos: 959 min cada 10 dias, 360
      # corridas a 2.66 min. De cada corrida tipica de 205 s:
      #
      #   ~180 s  un job sentado puliendo la API de Checks
      #   ~22 s   GitHub construyendo la imagen Docker del action, cada vez
      #   ~5 s    el trabajo util: titulo y cuerpo
      #
      # Ahora la proteccion de rama exige los checks POR NOMBRE, y este job
      # vuelve a durar segundos. El riesgo de enumerar --renombrar un check lo
      # deja de exigir en silencio-- lo cubre
      # `scripts/validar-checks-requeridos.sh` contra
      # `contracts/checks-requeridos.txt`, en los dos sentidos.
